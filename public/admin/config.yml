backend:
  name: git-gateway
  branch: main
media_folder: "public/uploads"
public_folder: "/uploads"
collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Cover Image, name: coverImage, widget: image, required: false }
      - label: Body
        name: body
        widget: block-editor
        hint: "Use the toolbar to add text, photos, and photo grids."
  - name: portfolio
    label: Portfolio
    folder: src/content/portfolio
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Video URL, name: videoURL, widget: string }
      - { label: Tags, name: tags, widget: select, multiple: true, options: [Editing, "Motion Graphics", VFX, Color, "Sound Design"] }
      - { label: Description, name: description, widget: text }
      - { label: Thumbnail, name: thumbnail, widget: image }
  - name: pages
    label: Pages
    files:
      - file: src/content/pages/about.md
        label: About
        name: about
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
          - { label: Headshot, name: headshot, widget: image }
  - name: "home"
    label: "Home"
    files:
      - file: src/content/home/homepage.json
        label: "Homepage"
        name: "homepage"
        editor: { preview: false }
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Subline", name: "subline", widget: "text", required: false }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - { label: "Primary Button Label", name: "ctaPrimaryLabel", widget: "string", required: false }
          - { label: "Primary Button Link", name: "ctaPrimaryUrl", widget: "string", required: false }
          - { label: "Secondary Button Label", name: "ctaSecondaryLabel", widget: "string", required: false }
          - { label: "Secondary Button Link", name: "ctaSecondaryUrl", widget: "string", required: false }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
  - name: "skills"
    label: "Skills"
    folder: "src/content/skills"
    create: true
    slug: "{{name | slug}}"
    extension: "json"
    editor: { preview: false }
    summary: "{{name}} - {{pov}}"
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Enter the skill name (e.g., Editing, Motion Graphics, etc.)" }
      - { label: "POV", name: "pov", widget: "text" }
      - label: "Highlights"
        name: "highlights"
        widget: "list"
        fields: [{ label: "Item", name: "item", widget: "string" }]

  - name: "about"
    label: "About"
    folder: "src/content/about"
    create: false
    slug: "index"
    extension: "json"
    editor: { preview: false }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Headshot", name: "headshot", widget: "image", required: false }
      - { label: "Additional Content", name: "additionalContent", widget: "markdown", required: false }

