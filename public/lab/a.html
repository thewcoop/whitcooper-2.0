<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>A · The Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/lab/lab.css" />
<style>
  #stage { position: relative; height: 100svh; min-height: 560px; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hint { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; color: var(--mut); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  .hint b { display: inline-block; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }
  main { position: relative; z-index: 2; background: #000; }
  section { max-width: 1180px; margin: 0 auto; padding: 96px 22px; }
  h2 { font-size: clamp(13px, 1.4vw, 15px); letter-spacing: .22em; text-transform: uppercase; color: var(--mut); font-weight: 500; margin: 0 0 38px; }
  .intro { font-size: clamp(22px, 3.6vw, 40px); line-height: 1.25; font-weight: 300; max-width: 24em; letter-spacing: -.01em; }
  .projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 860px) { .projects { grid-template-columns: 1fr; } }
  .proj { text-decoration: none; display: grid; gap: 14px; }
  .proj .ca-img { aspect-ratio: 16/10; border-radius: 4px; }
  .proj h3 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .proj p { margin: 0; color: var(--mut); font-size: 14px; }
  .tags { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
  .skills { border-top: 1px solid var(--line); }
  .skill { border-bottom: 1px solid var(--line); padding: 20px 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; cursor: pointer; }
  .skill h3 { margin: 0; font-size: clamp(26px, 5vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; transition: transform .35s cubic-bezier(.2,.8,.2,1), letter-spacing .35s; }
  .skill:hover h3, .skill.open h3 { transform: translateX(14px); text-shadow: -3px 0 rgba(255,42,95,.9), 3px 0 rgba(41,182,255,.9); }
  .skill .tool { align-self: end; color: var(--mut); font-size: 13px; text-align: right; }
  .skill .pov { grid-column: 1 / -1; max-height: 0; overflow: hidden; color: #c9c9ce; transition: max-height .4s, margin .4s; font-size: 17px; max-width: 34em; }
  .skill:hover .pov, .skill.open .pov { max-height: 80px; margin-top: 8px; }
  .posts { display: grid; gap: 0; border-top: 1px solid var(--line); }
  .post { display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .post .ca-img { width: 96px; height: 96px; border-radius: 4px; }
  .post h3 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .post p { margin: 2px 0 0; color: var(--mut); font-size: 14px; }
  .post time { color: var(--mut); font-size: 13px; }
  footer { text-align: center; color: var(--mut); padding: 60px 22px 120px; font-size: 14px; }
</style>
</head>
<body data-proto="a">
<div id="stage"><canvas id="gl"></canvas><div class="hint"><b>Scroll</b></div></div>
<main>
  <section><p class="intro" id="intro"></p></section>
  <section><h2>Best three</h2><div class="projects" id="projects"></div></section>
  <section><h2>What I do</h2><div class="skills" id="skills"></div></section>
  <section><h2>Latest</h2><div class="posts" id="posts"></div></section>
  <footer>Wooper makes music at <a href="https://wooper.world">wooper.world</a></footer>
</main>
<script src="/lab/lab-data.js"></script>
<script>
const D = window.WC;
document.getElementById('intro').textContent = D.intro;
document.getElementById('projects').innerHTML = D.projects.map((p) => `<a class="proj" href="${p.url}" target="_blank" rel="noopener"><div class="ca-img" style="--img:url('${p.img}')"><i></i></div><div class="tags">${p.tags.slice(0, 3).join(' · ')}</div><h3>${p.title}</h3><p>${p.blurb}</p></a>`).join('');
document.getElementById('skills').innerHTML = D.skills.map((s) => `<div class="skill"><h3>${s.name}</h3><span class="tool">${s.tools}</span><p class="pov">${s.pov}</p></div>`).join('');
document.querySelectorAll('.skill').forEach((el) => el.addEventListener('click', () => el.classList.toggle('open')));
document.getElementById('posts').innerHTML = D.posts.map((p) => `<a class="post" href="${p.url}"><div class="ca-img" style="--img:url('${p.img}')"><i></i></div><div><h3>${p.title}</h3><p>${p.blurb}</p></div><time>${p.date}</time></a>`).join('');

// ---- WebGL glass lens over the wide logo ----
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Tunable look. The Tune panel edits these live; "Copy settings" sends them back to Claude.
const T = { size: 0.24, magnify: 0.82, dispersion: 0.048, rim: 0.05, stretch: 0.2, flare: 0, grain: 0.06, glint: 0.1, bounce: 0.55, wobble: 0.5, soft: 0.5, gloss: 0.5 };
const RANGES = { size: [0.1, 0.4, 0.01, 'Lens size'], magnify: [0.35, 1, 0.01, 'Magnify (lower = stronger)'], dispersion: [0, 0.07, 0.001, 'Rainbow spread'], rim: [0, 1.6, 0.05, 'Glass rim glow'], stretch: [0, 2, 0.05, 'Stretch when moving'], flare: [0, 1.2, 0.05, 'Lens flare streak'], glint: [0, 0.6, 0.01, 'Soft highlight'], gloss: [0, 1, 0.05, 'Gel gloss (curved sheen)'], bounce: [0, 1, 0.05, 'Bounce (springiness)'], wobble: [0, 1, 0.05, 'Blob wobble'], soft: [0, 1, 0.05, 'Soft gel edge'], grain: [0, 0.12, 0.005, 'Film grain'] };

if (gl) {
  const vs = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
  const fs = `precision highp float;
  varying vec2 uv; uniform sampler2D tex; uniform vec2 res, mouse, vel, rip; uniform float t, k, rad, mag, disp, rimk, flare, grain, ripAge, glintk, wobk, softk, glossk;
  vec3 hsv(float h, float s, float v){ vec3 c = clamp(abs(mod(h*6. + vec3(0.,4.,2.), 6.) - 3.) - 1., 0., 1.); return v * mix(vec3(1.), c, s); }
  float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
  void main(){
    vec2 asp = vec2(res.x/res.y, 1.);
    vec2 d = (uv - mouse) * asp;
    float sp = clamp(length(vel*asp), 0., 1.0);
    // stretch the lens along its direction of travel
    vec2 vd = vel*asp / (length(vel*asp) + 1e-4);
    float along = dot(d, vd); vec2 perp = d - along*vd;
    float r = length(vec2(along / (1. + sp*.45), length(perp) * (1. + sp*.18)));
    float th = atan(d.y, d.x), ph = atan(vel.y, vel.x);
    // blob edge: jiggles along the direction of travel, plus a slow organic breathing
    float shape = 1. + wobk*(.55*sp*cos(2.*(th-ph)) + .06*sin(3.*th + t*1.6) + .045*cos(5.*th - t*1.2)) + .02*sin(2.*th + t*.7);
    float rn = r / (rad * shape);
    vec2 dir = d / (length(d) + 1e-4);
    float inside = 1. - smoothstep(1. - softk*.2, 1.0, rn);
    // sphere-like magnification: strong in the middle, none at the rim
    float scale = mix(1., mag + (1.-mag)*pow(clamp(rn,0.,1.), 1.8), inside);
    scale *= 1. - .06*exp(-max(rn-1.,0.)*7.)*(1.-inside);      // faint pinch just outside the glass
    vec2 base = mouse + (d*scale)/asp;
    // click shockwave
    vec2 rd = (uv - rip)*asp; float rr = length(rd);
    float wave = exp(-pow((rr - ripAge*.85)/.045, 2.)) * exp(-ripAge*2.2);
    base += (rd/(rr+1e-4)) * wave * .022 / asp;
    // spectral dispersion: 9 wavelengths smeared along the radius, strongest at the glass edge
    float amount = (.003 + disp*pow(clamp(rn,0.,1.3), 3.0)*inside + sp*disp*.5*smoothstep(.2,1.,rn)*inside + wave*.008) * k;
    vec3 acc = vec3(0.), wsum = vec3(0.);
    float jit = hash(uv*res + t) - .5;
    for (int i = 0; i < 16; i++){
      float f = (float(i) + jit*.9)/15.;
      vec3 w = hsv((1.-clamp(f,0.,1.))*.78, 1., 1.);
      vec2 o = dir * (f-.5) * 2. * amount / asp;
      acc += texture2D(tex, base + o).g * w; wsum += w;
    }
    vec3 col = acc / wsum;
    // glass: bright spectral rim, soft inner shade, specular glint, bottom-right caustic
    vec2 pn = d / rad;
    float edge = smoothstep(.72, 1., rn) * (1. - smoothstep(1., 1.035, rn));
    float ang = atan(pn.y, pn.x) / 6.2831 + .5;
    vec3 rim = hsv(fract(ang + t*.02), .85, 1.) * pow(edge, 1.6) * rimk;
    float shade = .1 * smoothstep(.2, 1., rn) * inside;
    float glint = smoothstep(.75, 0., length((pn - vec2(-.3,.38))*vec2(.8,1.5))) * glintk * inside * k;
    float arc = smoothstep(.2, 0., abs(rn - .8)) * smoothstep(.15, .95, dot(dir, normalize(vec2(-.6,.8)))) * glossk * .32 * inside * k;
    glint += arc;
    float caustic = edge * smoothstep(-.1, .9, dot(dir, vec2(.55,-.8))) * rimk * .7;
    col = col*(1.-shade) + rim*.8 + glint + vec3(1.,.93,.9)*caustic*.6;
    // soft bloom and an anamorphic streak through the lens
    col += vec3(.9,.95,1.) * exp(-r*r/(rad*rad*.9)) * .045 * k;
    float streak = smoothstep(.01, 0., abs(d.y)) * smoothstep(rad*2.6, 0., abs(d.x)) * .22 * flare * k;
    col += vec3(streak*.75, streak*.88, streak);
    col += (hash(uv*res + t) - .5) * grain;
    gl_FragColor = vec4(col, 1.);
  }`;
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const tex = gl.createTexture(); const tc = document.createElement('canvas'); const tx = tc.getContext('2d');
  const logo = new Image(); logo.src = '/whit-site-logo.svg';
  const drawType = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2); const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr; tc.width = canvas.width; tc.height = canvas.height;
    tx.fillStyle = '#000'; tx.fillRect(0, 0, tc.width, tc.height);
    // faint grid so the glass always has something to bend
    tx.strokeStyle = 'rgba(255,255,255,.09)'; tx.lineWidth = dpr;
    for (let x = 0; x < tc.width; x += 60 * dpr) { tx.beginPath(); tx.moveTo(x, 0); tx.lineTo(x, tc.height); tx.stroke(); }
    for (let y = 0; y < tc.height; y += 60 * dpr) { tx.beginPath(); tx.moveTo(0, y); tx.lineTo(tc.width, y); tx.stroke(); }
    // the real wide logo, centred
    const ar = logo.naturalWidth && logo.naturalHeight ? logo.naturalWidth / logo.naturalHeight : 1609.05 / 530.75;
    const lw = Math.min(W * 0.86, H * 0.4 * ar) * dpr, lh = lw / ar;
    tx.drawImage(logo, (tc.width - lw) / 2, tc.height * 0.46 - lh / 2, lw, lh);
    tx.fillStyle = '#9a9aa2'; tx.textAlign = 'center'; tx.textBaseline = 'middle'; tx.font = `500 ${Math.max(12, 13 * dpr)}px Inter, sans-serif`;
    tx.fillText('EDITOR  ·  MOTION  ·  COLOR  ·  WIZARD', tc.width / 2, tc.height * 0.46 + lh / 2 + 34 * dpr);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.viewport(0, 0, canvas.width, canvas.height);
  };
  // Gel physics: the lens is a spring-mounted blob. Position, squash/stretch and wobble are all springs.
  let target = { x: 0.5, y: 0.46 }, anchor = { x: 0.5, y: 0.46 }, P = { x: 0.5, y: 0.46, vx: 0, vy: 0 };
  let S = { x: 0, y: 0, vx: 0, vy: 0 }, moved = false, lastMove = -1e9, idle = 0, press = 0, pressT = 0, prevT = performance.now() / 1000;
  let ripple = { x: .5, y: .46, t0: -10 };
  const step = (dt) => {
    const kk = 55, zeta = 0.95 - 0.7 * T.bounce, dd = 2 * zeta * Math.sqrt(kk);
    for (const a of ['x', 'y']) { const v = 'v' + a; P[v] += ((target[a] - P[a]) * kk - P[v] * dd) * dt; P[a] += P[v] * dt; }
    const ks = 140, ds = 2 * (0.5 - 0.3 * T.bounce) * Math.sqrt(ks);               // jelly: stretch follows velocity but overshoots and wobbles
    for (const a of ['x', 'y']) { const v = 'v' + a; S[v] += ((P[v] * 0.9 - S[a]) * ks - S[v] * ds) * dt; S[a] += S[v] * dt; }
  };
  window.__lens = () => ({ x: P.x, y: P.y, sx: S.x, sy: S.y });
  const toUV = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: 1 - (e.clientY - r.top) / r.height }; };
  addEventListener('pointermove', (e) => { anchor = toUV(e); moved = true; lastMove = performance.now(); });
  addEventListener('pointerdown', (e) => { if (e.target.closest('.lab-panel, .lab-fab, .tune-fab, .lab-bar')) return; anchor = toUV(e); moved = true; lastMove = performance.now(); pressT = 1; ripple = { ...anchor, t0: performance.now() / 1000 }; });
  addEventListener('pointerup', () => (pressT = 0));
  addEventListener('resize', drawType);
  let visible = true; new IntersectionObserver(([e]) => (visible = e.isIntersecting)).observe(canvas);
  const loop = (now) => {
    requestAnimationFrame(loop); if (!visible) return;
    const t = now / 1000, dt = Math.min(0.033, Math.max(0.001, t - prevT)); prevT = t;
    // when idle the lens stays where it is and floats gently; it never teleports. With no pointer at all (phones) it roams the logo.
    const still = now - lastMove > 1800 || reduce;
    idle += ((still ? 1 : 0) - idle) * Math.min(1, dt * (still ? 0.8 : 6));
    const home = moved ? anchor : { x: 0.5 + Math.cos(t * 0.5) * 0.28, y: 0.46 + Math.sin(t * 0.8) * 0.13 };
    const amp = moved ? 0.022 : 0.0;
    target = { x: home.x + Math.cos(t * 0.9) * amp * idle, y: home.y + Math.sin(t * 1.3) * amp * 0.8 * idle };
    step(dt);
    press += (pressT - press) * Math.min(1, dt * 8);
    const asp = canvas.width / canvas.height;
    const k = Math.max(0.15, 1 - scrollY / (innerHeight * 0.8));
    const rad = Math.min(T.size, 0.32 * asp) * (1 + press * 0.22);
    gl.uniform2f(U('res'), canvas.width, canvas.height); gl.uniform2f(U('mouse'), P.x, P.y);
    gl.uniform2f(U('vel'), S.x * T.stretch * 1.6, S.y * T.stretch * 1.6); gl.uniform2f(U('rip'), ripple.x, ripple.y);
    gl.uniform1f(U('ripAge'), Math.max(0, t - ripple.t0)); gl.uniform1f(U('t'), t); gl.uniform1f(U('k'), k);
    gl.uniform1f(U('rad'), rad); gl.uniform1f(U('mag'), T.magnify); gl.uniform1f(U('disp'), T.dispersion);
    gl.uniform1f(U('rimk'), T.rim); gl.uniform1f(U('flare'), T.flare); gl.uniform1f(U('grain'), T.grain);
    gl.uniform1f(U('glintk'), T.glint); gl.uniform1f(U('wobk'), T.wobble); gl.uniform1f(U('softk'), T.soft); gl.uniform1f(U('glossk'), T.gloss);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
  const start = () => { drawType(); requestAnimationFrame(loop); };
  Promise.all([document.fonts.load('500 13px Inter'), logo.decode ? logo.decode().catch(() => {}) : Promise.resolve()]).then(start);

  // Tune panel: live sliders for the lens look
  const fab = document.createElement('button'); fab.className = 'lab-fab tune-fab'; fab.style.right = '112px'; fab.textContent = 'Tune lens';
  const panel = document.createElement('div'); panel.className = 'lab-panel'; panel.style.right = '14px';
  panel.innerHTML = '<h4>Tune the lens</h4><p>Drag until it feels right, then copy the numbers and paste them to Claude.</p><div id="sliders"></div><button class="copy">Copy my settings</button>';
  const sl = panel.querySelector('#sliders');
  Object.entries(RANGES).forEach(([key, [min, max, step, label]]) => {
    const row = document.createElement('label'); row.style.cssText = 'display:grid;grid-template-columns:1fr 54px;gap:4px 10px;font-size:13px;color:#c5c5ca;margin-bottom:12px';
    row.innerHTML = `<span>${label}</span><output style="text-align:right;color:#fff">${T[key]}</output><input style="grid-column:1/-1;width:100%" type="range" min="${min}" max="${max}" step="${step}" value="${T[key]}">`;
    const input = row.querySelector('input'), out = row.querySelector('output');
    input.oninput = () => { T[key] = +input.value; out.textContent = T[key]; };
    sl.append(row);
  });
  panel.querySelector('.copy').onclick = async (e) => {
    const text = `Lens settings: ${JSON.stringify(T)}`;
    try { await navigator.clipboard.writeText(text); } catch { const x = document.createElement('textarea'); x.value = text; document.body.append(x); x.select(); document.execCommand('copy'); x.remove(); }
    e.target.textContent = 'Copied. Paste it to Claude'; setTimeout(() => (e.target.textContent = 'Copy my settings'), 2500);
  };
  fab.onclick = () => { panel.classList.toggle('open'); };
  document.body.append(panel, fab);
} else {
  document.getElementById('stage').innerHTML = '<h1 style="text-align:center;padding-top:30vh;font-size:12vw;font-weight:800">WHIT COOPER</h1>';
}
</script>
<script src="/lab/lab.js"></script>
</body>
</html>
